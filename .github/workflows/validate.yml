name: Validate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  flutter-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
      - name: Analyze and test packages sequentially
        run: bash tool/validate.sh

  android-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
      - name: Run camera_android_camerax JVM unit tests
        run: bash tool/test_android_jvm.sh

  macos-native-synthetic:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run native synthetic camera tests
        run: python3 tool/test_macos_camera_native.py

  ios-native-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
      - name: Fetch the iOS engine artifacts
        run: flutter precache --ios
      - name: Run camera_avfoundation native tests on an iOS simulator
        run: python3 tool/test_ios_camera_native.py
