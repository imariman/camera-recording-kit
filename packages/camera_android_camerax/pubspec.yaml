name: camera_android_camerax
publish_to: 'none'
description: Android implementation of the camera plugin using the CameraX library.
repository: https://github.com/imariman/camera-recording-kit/tree/main/packages/camera_android_camerax
issue_tracker: https://github.com/imariman/camera-recording-kit/issues
version: 0.7.4+3

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: camera
    platforms:
      android:
        package: io.flutter.plugins.camerax
        pluginClass: CameraAndroidCameraxPlugin
        dartPluginClass: AndroidCameraCameraX

dependencies:
  async: ^2.5.0
  camera_platform_interface: ^2.13.0
  flutter:
    sdk: flutter
  meta: ^1.7.0
  stream_transform: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.2.0
  dart_code_linter: 4.1.5
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: any
  logging: ^1.2.0
  mockito: ^5.4.4
  path: ^1.8.0
  pigeon: ^26.1.4

topics:
  - camera
