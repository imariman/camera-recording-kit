include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Upstream generated Pigeon and Mockito outputs are not hand-maintained.
    - "**/*.g.dart"
    - "**/*.mocks.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

dart_code_linter:
  metrics:
    cyclomatic-complexity: 15

linter:
  rules:
    # Retain upstream CameraX enum names and rotation test constants.
    constant_identifier_names: false
