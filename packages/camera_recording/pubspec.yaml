name: camera_recording
description: Shared camera recording orchestration for Flutter camera backends.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  camera: ^0.12.0+2
  camera_android_camerax:
    path: ../camera_android_camerax
  camera_avfoundation:
    path: ../camera_avfoundation
  camera_desktop:
    path: ../camera_desktop
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  camera_android_camerax:
    path: ../camera_android_camerax
  camera_avfoundation:
    path: ../camera_avfoundation
  camera_desktop:
    path: ../camera_desktop
